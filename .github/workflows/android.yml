name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Instalar cargo-apk
        run: cargo install cargo-apk --locked

      - name: Instalar plataforma Android 33
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;34.0.0"

      - name: Build APK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          echo "NDK: $ANDROID_NDK_ROOT"
          ls "$ANDROID_NDK_ROOT" | head
          cargo apk build --release

      - uses: actions/upload-artifact@v4
        with:
          name: photocraft-poc-apk
          path: target/release/apk/*.apk

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/apk/*.apk
